<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculation System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2563eb;
            margin-bottom: 8px;
            font-size: 28px;
        }

        header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 5px;
        }

        h2 {
            font-size: 19px;
            margin: 25px 0 15px;
            color: #334155;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 15px;
            align-items: center;
            margin-bottom: 13px;
        }

        .subject-row label {
            margin: 0;
            font-weight: normal;
        }

        .subject-row input {
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .calculate {
            background: #2563eb;
            color: white;
        }

        .calculate:hover {
            background: #1d4ed8;
        }

        .reset {
            background: #e2e8f0;
            color: #334155;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            text-align: center;
        }

        .result h2 {
            color: #1d4ed8;
            margin: 0 0 15px;
        }

        .gpa {
            font-size: 38px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        .result p {
            margin: 8px 0;
        }

        .report-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            text-align: left;
        }

        .report-table th,
        .report-table td {
            border: 1px solid #cbd5e1;
            padding: 10px;
            font-size: 13px;
        }

        .report-table th {
            background: #dbeafe;
        }

        .report-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .download {
            background: #16a34a;
            color: white;
        }

        .print {
            background: #475569;
            color: white;
        }

        .error {
            display: none;
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 23px;
            }

            .subject-row {
                grid-template-columns: 1fr 85px;
                gap: 8px;
            }

            .buttons,
            .report-actions {
                flex-direction: column;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            body * {
                visibility: hidden;
            }

            #result,
            #result * {
                visibility: visible;
            }

            #result {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 25px;
                border: none;
                background: white;
                color: black;
            }

            .report-actions {
                display: none !important;
            }

            .report-table th {
                background: #dbeafe !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>GPA Calculator</h1>
        <p>Mathematics and Computing</p>
        <p>B.Tech Student GPA Calculation System</p>
    </header>

    <h2>Student Details</h2>

    <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName"
               placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label for="rollNumber">Roll Number</label>
        <input type="text" id="rollNumber"
               placeholder="Enter your roll number">
    </div>

    <h2>Enter Subject Marks (Out of 100)</h2>

    <div id="subjects"></div>

    <div class="buttons">
        <button class="calculate" onclick="calculateGPA()">
            Calculate GPA
        </button>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>
    </div>

    <p class="error" id="error"></p>

    <div class="result" id="result">

        <h2>GPA Result Report</h2>

        <p id="resultName"></p>
        <p id="resultRoll"></p>
        <p id="totalMarks"></p>
        <p id="averageMarks"></p>

        <div class="gpa" id="gpaValue">0.00</div>
        <p>Final GPA out of 10</p>

        <table class="report-table">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
            </thead>
            <tbody id="reportSubjects"></tbody>
        </table>

        <div class="report-actions">

            <button class="download" onclick="downloadReport()">
                Download GPA Report
            </button>

            <button class="print" onclick="printReport()">
                Print GPA Report
            </button>

        </div>

    </div>

    <footer>
        Developed by GOURAV KUSHWAH & Gazal | Mathematics and Computing
    </footer>

</div>

<script>

const subjects = [
    "Advance Calculus",
    "Introduction to Computing",
    "Ordinary Differential Equation",
    "Digital Logic Design",
    "Computer Programming",
    "Data Analysis",
    "Computer Programming Lab",
    "Language Lab"
];

let reportData = null;

const subjectContainer = document.getElementById("subjects");

subjects.forEach((subject, index) => {

    const row = document.createElement("div");
    row.className = "subject-row";

    row.innerHTML = `
        <label for="marks${index}">${subject}</label>
        <input
            type="number"
            id="marks${index}"
            min="0"
            max="100"
            step="any"
            placeholder="0-100"
        >
    `;

    subjectContainer.appendChild(row);
});

function calculateGPA() {

    const name = document.getElementById("studentName").value.trim();
    const roll = document.getElementById("rollNumber").value.trim();

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";
    reportData = null;

    if (name === "" || roll === "") {
        error.textContent =
            "Please enter student name and roll number.";
        error.style.display = "block";
        return;
    }

    let total = 0;
    let marksList = [];

    for (let i = 0; i < subjects.length; i++) {

        const input = document.getElementById("marks" + i);
        const value = input.value.trim();

        if (value === "") {
            error.textContent =
                "Please enter marks for all eight subjects.";
            error.style.display = "block";
            return;
        }

        const marks = Number(value);

        if (!Number.isFinite(marks) || marks < 0 || marks > 100) {
            error.textContent =
                "Marks must be between 0 and 100.";
            error.style.display = "block";
            return;
        }

        marksList.push(marks);
        total += marks;
    }

    const average = total / subjects.length;
    const gpa = average / 10;

    reportData = {
        name,
        roll,
        total,
        average,
        gpa,
        marksList
    };

    document.getElementById("resultName").textContent =
        "Student Name: " + name;

    document.getElementById("resultRoll").textContent =
        "Roll Number: " + roll;

    document.getElementById("totalMarks").textContent =
        "Total Marks: " + total.toFixed(2) + " / 800";

    document.getElementById("averageMarks").textContent =
        "Average Marks: " + average.toFixed(2);

    document.getElementById("gpaValue").textContent =
        gpa.toFixed(2);

    const reportSubjects =
        document.getElementById("reportSubjects");

    reportSubjects.innerHTML = "";

    subjects.forEach((subject, index) => {

        const row = document.createElement("tr");

        const subjectCell = document.createElement("td");
        subjectCell.textContent = subject;

        const marksCell = document.createElement("td");
        marksCell.textContent = marksList[index].toFixed(2);

        row.appendChild(subjectCell);
        row.appendChild(marksCell);

        reportSubjects.appendChild(row);
    });

    result.style.display = "block";

    result.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function downloadReport() {

    if (!reportData) {
        alert("Please calculate GPA first.");
        return;
    }

    let csv = "GPA CALCULATION SYSTEM\n\n";

    csv += "Student Name," + csvEscape(reportData.name) + "\n";
    csv += "Roll Number," + csvEscape(reportData.roll) + "\n\n";

    csv += "Subject,Marks\n";

    subjects.forEach((subject, index) => {
        csv += csvEscape(subject) + "," +
               reportData.marksList[index].toFixed(2) + "\n";
    });

    csv += "\nTotal Marks," + reportData.total.toFixed(2) + " / 800\n";
    csv += "Average Marks," + reportData.average.toFixed(2) + "\n";
    csv += "Final GPA," + reportData.gpa.toFixed(2) + " / 10\n";

    const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "GPA_Report_" +
        reportData.roll.replace(/[^a-zA-Z0-9_-]/g, "_") + ".csv";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

function csvEscape(value) {
    return '"' + String(value).replace(/"/g, '""') + '"';
}

function printReport() {

    if (!reportData) {
        alert("Please calculate GPA first.");
        return;
    }

    window.print();
}

function resetForm() {

    document.getElementById("studentName").value = "";
    document.getElementById("rollNumber").value = "";

    for (let i = 0; i < subjects.length; i++) {
        document.getElementById("marks" + i).value = "";
    }

    document.getElementById("result").style.display = "none";
    document.getElementById("error").style.display = "none";

    reportData = null;
}

</script>

</body>
</html>
