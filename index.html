<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculation System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
            padding: 30px 15px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2563eb;
            margin-bottom: 8px;
            font-size: 28px;
        }

        header p {
            color: #64748b;
            font-size: 14px;
        }

        h2 {
            font-size: 19px;
            margin: 25px 0 15px;
            color: #334155;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .subject-row {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 15px;
            align-items: center;
            margin-bottom: 13px;
        }

        .subject-row label {
            margin: 0;
            font-weight: normal;
        }

        .subject-row input {
            text-align: center;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .calculate {
            background: #2563eb;
            color: white;
        }

        .calculate:hover {
            background: #1d4ed8;
        }

        .reset {
            background: #e2e8f0;
            color: #334155;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 22px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            text-align: center;
        }

        .result h2 {
            color: #1d4ed8;
            margin: 0 0 15px;
        }

        .gpa {
            font-size: 38px;
            font-weight: bold;
            color: #2563eb;
            margin: 10px 0;
        }

        .result p {
            margin: 8px 0;
        }

        .error {
            display: none;
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 23px;
            }

            .subject-row {
                grid-template-columns: 1fr 85px;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>GPA Calculator</h1>
        <p>Mathematics and Computing</p>
        <p>B.Tech Student GPA Calculation System</p>
    </header>

    <h2>Student Details</h2>

    <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName"
               placeholder="Enter your name">
    </div>

    <div class="form-group">
        <label for="rollNumber">Roll Number</label>
        <input type="text" id="rollNumber"
               placeholder="Enter your roll number">
    </div>

    <h2>Enter Subject Marks (Out of 100)</h2>

    <div id="subjects"></div>

    <div class="buttons">
        <button class="calculate" onclick="calculateGPA()">
            Calculate GPA
        </button>

        <button class="reset" onclick="resetForm()">
            Reset
        </button>
    </div>

    <p class="error" id="error"></p>

    <div class="result" id="result">
        <h2>GPA Result</h2>
        <p id="resultName"></p>
        <p id="resultRoll"></p>
        <p id="totalMarks"></p>
        <p id="averageMarks"></p>

        <div class="gpa" id="gpaValue">0.00</div>
        <p>Final GPA out of 10</p>
    </div>

    <footer>
        Developed by Gazal | Mathematics and Computing
    </footer>

</div>

<script>

const subjects = [
    "Advance Calculus",
    "Introduction to Computing",
    "Ordinary Differential Equation",
    "Digital Logic Design",
    "Computer Programming",
    "Data Analysis",
    "Computer Programming Lab",
    "Language Lab"
];

const subjectContainer = document.getElementById("subjects");

subjects.forEach((subject, index) => {

    const row = document.createElement("div");
    row.className = "subject-row";

    row.innerHTML = `
        <label for="marks${index}">${subject}</label>
        <input
            type="number"
            id="marks${index}"
            min="0"
            max="100"
            step="any"
            placeholder="0-100"
        >
    `;

    subjectContainer.appendChild(row);
});

function calculateGPA() {

    const name = document.getElementById("studentName").value.trim();
    const roll = document.getElementById("rollNumber").value.trim();

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.style.display = "none";
    result.style.display = "none";

    if (name === "" || roll === "") {
        error.textContent = "Please enter student name and roll number.";
        error.style.display = "block";
        return;
    }

    let total = 0;

    for (let i = 0; i < subjects.length; i++) {

        const input = document.getElementById("marks" + i);
        const value = input.value.trim();

        if (value === "") {
            error.textContent = "Please enter marks for all eight subjects.";
            error.style.display = "block";
            return;
        }

        const marks = Number(value);

        if (!Number.isFinite(marks) || marks < 0 || marks > 100) {
            error.textContent = "Marks must be between 0 and 100.";
            error.style.display = "block";
            return;
        }

        total += marks;
    }

    const average = total / subjects.length;
    const gpa = average / 10;

    document.getElementById("resultName").textContent =
        "Student Name: " + name;

    document.getElementById("resultRoll").textContent =
        "Roll Number: " + roll;

    document.getElementById("totalMarks").textContent =
        "Total Marks: " + total.toFixed(2) + " / 800";

    document.getElementById("averageMarks").textContent =
        "Average Marks: " + average.toFixed(2);

    document.getElementById("gpaValue").textContent =
        gpa.toFixed(2);

    result.style.display = "block";
}

function resetForm() {

    document.getElementById("studentName").value = "";
    document.getElementById("rollNumber").value = "";

    for (let i = 0; i < subjects.length; i++) {
        document.getElementById("marks" + i).value = "";
    }

    document.getElementById("result").style.display = "none";
    document.getElementById("error").style.display = "none";
}

</script>

</body>
</html>
